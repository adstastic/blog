{{ define "main" }}
<section class="site-header">
    {{ partial "masthead.html" . }}
    {{ partial "nav.html" . }}
</section>

<section class="site-intro">
    <p>All Tags</p>
</section>

<section class="home">
    <ul class="tag-list">
        {{ range .Data.Terms.Alphabetical }}
        <li>
            <a href="{{ .Page.Permalink }}">#{{ .Term | urlize }}</a>
            <span class="tag-count">({{ .Count }})</span>
        </li>
        {{ end }}
    </ul>
    
    <p><a href="/">&larr; Back to all posts</a></p>
</section>

<hr>
<div class="copyright">
    <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. <a href="/credits">Credits</a>.</p>
</div>
{{ end }}
