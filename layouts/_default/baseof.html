<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | plainify }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="/feed.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBR26ZPS1G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-MBR26ZPS1G');
    </script>
    <script>
        // Runs before first paint to prevent a flash of the wrong theme.
        // Three stored values: "light", "dark", or absent/"system" = follow OS.
        (function() {
            var pref = localStorage.getItem('theme') || 'system';
            var dark = pref === 'dark' ||
                (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark-theme');
            document.documentElement.dataset.themePref = pref;
        })();
    </script>
</head>
<body>
    <main class="page-content">
        {{ block "main" . }}{{ end }}
    </main>

    <script>
        // Cycles system -> light -> dark. The icon shows the CURRENT state and
        // the label names the next action, so the control describes itself.
        (function() {
            var btn = document.querySelector('.theme-toggle');
            if (!btn) return;
            var html = document.documentElement;
            var order = ['system', 'light', 'dark'];
            var next = { system: 'light', light: 'dark', dark: 'system' };

            function apply(pref) {
                var dark = pref === 'dark' ||
                    (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                html.classList.toggle('dark-theme', dark);
                html.dataset.themePref = pref;
                btn.dataset.themeState = pref;
                var name = { system: 'auto', light: 'light', dark: 'dark' };
                var label = 'Theme: ' + name[pref] + '. Switch to ' + name[next[pref]] + '.';
                btn.setAttribute('aria-label', label);
                btn.setAttribute('title', label);
                if (pref === 'system') localStorage.removeItem('theme');
                else localStorage.setItem('theme', pref);
            }

            apply(html.dataset.themePref || 'system');
            btn.addEventListener('click', function() {
                apply(next[btn.dataset.themeState] || 'light');
            });
            // Follow the OS live while the preference is system.
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
                if ((html.dataset.themePref || 'system') === 'system') apply('system');
            });
        })();
    </script>
</body>
</html>
