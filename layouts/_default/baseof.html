<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | plainify }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="/feed.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBR26ZPS1G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-MBR26ZPS1G');
    </script>
    <script>
        // Runs before first paint to prevent a flash of the wrong theme.
        // An explicit choice wins; absent one, follow the OS.
        (function() {
            const stored = localStorage.getItem('theme');
            const dark = stored
                ? stored === 'dark'
                : matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark-theme');
        })();
    </script>
</head>
<body>
    <main class="page-content relative py-8 px-6 mx-auto box-border max-w-[48rem] w-full">
        {{ block "main" . }}{{ end }}
    </main>

    <script>
        // The head script already decided the theme; this only syncs the
        // checkbox to it and records an explicit choice. html.dark-theme is
        // the single source of truth — body[data-theme] was written here for
        // years and no CSS ever read it.
        (function() {
            const toggle = document.getElementById('dark-mode-toggle');
            const html = document.documentElement;
            toggle.checked = html.classList.contains('dark-theme');
            toggle.addEventListener('change', function() {
                html.classList.toggle('dark-theme', this.checked);
                localStorage.setItem('theme', this.checked ? 'dark' : 'light');
            });
        })();
    </script>
</body>
</html>
